# Local development services. Start with `npm run services:up`.
# The `app` profile additionally runs the API and website in production-mode containers:
#   docker compose --profile app up --build
name: december-scribbles

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds_local_password
      POSTGRES_DB: december_scribbles
    ports:
      - '5433:5432' # 5433 on the host avoids clashing with a locally installed PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ds -d december_scribbles']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development only (production uses AWS S3,
  # Cloudflare R2 or similar). S3Mock ignores credentials and serves objects publicly.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ds-media
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '9090:9090'
    volumes:
      - s3-data:/s3mockroot

  # Captures outgoing email; web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '1025:1025'
      - '8025:8025'

  # Release step: apply database migrations, then exit. The API starts only after it succeeds.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [npx, prisma, migrate, deploy]
    environment:
      DATABASE_URL: postgresql://ds:ds_local_password@postgres:5432/december_scribbles?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: 'true'
      DATABASE_URL: postgresql://ds:ds_local_password@postgres:5432/december_scribbles?schema=public
      S3_ENDPOINT: http://s3:9090
      SMTP_HOST: mailpit
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_started
    ports:
      - '4000:4000'

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        SITE_URL: http://localhost:3000
    environment:
      API_INTERNAL_URL: http://api:4000
      SITE_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  s3-data:
